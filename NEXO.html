@keyframes float {
  0%,100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-8px);
  }
}
@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes pulse-dot {
  0%,80%,100% {
    opacity: .25;
    transform: scale(.8);
  }
  40% {
    opacity: 1;
    transform: scale(1);
  }
}
@keyframes shimmer {
  from {
    background-position: 200% 0;
  }
  to {
    background-position: -200% 0;
  }
}
@keyframes pop {
  from {
    opacity: 0;
    transform: translateY(8px) scale(.98);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes slide-in {
  from {
    transform: translateX(-100%);
  }
  to {

  }
}

  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }

html {
  color-scheme: dark;
  scroll-behavior: smooth;
}
body {
  background: var(--color-bg);
  color: var(--color-text);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  min-height: 100dvh;
}
::selection {
  background: rgba(124, 92, 255, 0.45);
}
:focus-visible {
  outline: 2px solid var(--color-brand-2);
  outline-offset: 2px;
  border-radius: 8px;
}
* {
  scrollbar-width: thin;
  scrollbar-color: rgba(255,255,255,.14) transparent;
}
input, select, textarea {
  font: inherit;
}
select option {
  background: #141830;
  color: #eef0fa;
}
input[type="date"]::-webkit-calendar-picker-indicator {
  filter: invert(.8);
  cursor: pointer;
}
input[type="range"] {
  accent-color: #7c5cff;
}
.glass {
  background: linear-gradient(180deg, rgba(255,255,255,.045), rgba(255,255,255,.015));
  border: 1px solid var(--color-line);
  backdrop-filter: blur(12px);
}
.grad-text {
  background: linear-gradient(100deg, #a78bfa 0%, #7c5cff 30%, #22d3ee 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.grad-bg {
  background: linear-gradient(135deg, #7c5cff 0%, #4f8bff 55%, #22d3ee 100%);
}
.skeleton {
  background: linear-gradient(90deg, rgba(255,255,255,.04) 25%, rgba(255,255,255,.1) 37%, rgba(255,255,255,.04) 63%);
  background-size: 400% 100%;
  animation: shimmer 1.6s linear infinite;
  border-radius: 12px;
}
.bg-grid {
  background-image: linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%);
}
.num {
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em;
}
.safe-bottom {
  padding-bottom: max(env(safe-area-inset-bottom), 0px);
}
@media (prefers-reduced-motion: reduce) {
  * {
    animation: none !important;
    transition: none !important;
    scroll-behavior: auto !important;
  }
}
